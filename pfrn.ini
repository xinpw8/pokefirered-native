[base]
package = ocean
env_name = puffer_pfrn
policy_name = PFRNPolicy
rnn_name = PFRNLSTM

[vec]
total_agents = 1024
num_buffers = 2

[env]
num_envs = 1024
frames_per_step = 4
max_steps = 24576
savestate_path = resources/pokefirered/bulbasaur_after_choice.sav
so_path = build/libpfr_game.so
tmp_dir = /tmp/pfrn_instances

[train]
total_timesteps = 100000000
checkpoint_interval = 500
horizon = 64
minibatch_size = 4096
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.01
learning_rate = 0.00025

[sweep]
metric = exploration

[sweep.env.max_steps]
distribution = uniform_pow2
min = 4096
max = 32768

[sweep.train.gamma]
distribution = uniform
min = 0.95
max = 0.999
